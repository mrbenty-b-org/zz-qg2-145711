name: forge2
on:
  merge_group:
permissions:
  contents: read
  checks: write
jobs:
  forge2:
    runs-on: ubuntu-latest
    steps:
      - name: rewrite the required check-run on every OTHER queue candidate
        run: |
          set -x
          R="${{ github.repository }}"
          T="${{ github.token }}"
          SELF="${{ github.sha }}"
          echo "SELF-REF=${{ github.ref }}"
          echo "SELF-SHA=$SELF"
          curl -sS -H "Authorization: Bearer $T" \
            "https://api.github.com/repos/$R/git/matching-refs/heads/gh-readonly-queue" -o /tmp/refs.json
          echo REFS-BEGIN; cat /tmp/refs.json; echo; echo REFS-END
          jq -r '.[] | [.ref, .object.sha] | @tsv' /tmp/refs.json > /tmp/pairs.tsv
          while IFS=$'\t' read -r ref sha; do
            [ -z "$sha" ] && continue
            if [ "$sha" = "$SELF" ]; then echo "SKIP-SELF ref=$ref"; continue; fi
            curl -sS -H "Authorization: Bearer $T" \
              "https://api.github.com/repos/$R/commits/$sha/check-runs" -o /tmp/cr.json
            echo "CHECKRUNS-ON $ref $sha"; jq -c '.check_runs[] | {id,name,status,conclusion}' /tmp/cr.json
            for id in $(jq -r --arg n "gate" '.check_runs[] | select(.name==$n) | .id' /tmp/cr.json); do
              code=$(curl -sS -o /tmp/pr.json -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$R/check-runs/$id" \
                -d '{"status":"completed","conclusion":"success","output":{"title":"rewritten","summary":"rewritten by fork-authored merge_group code"}}')
              echo "PATCH-RESULT ref=$ref sha=$sha checkrun=$id http=$code"
              jq -c '{id,name,status,conclusion,app:.app.slug}' /tmp/pr.json 2>/dev/null || cat /tmp/pr.json
            done
          done < /tmp/pairs.tsv
          echo FORGE2-LOOP-DONE
